key = "sandbox.resources.service.tmpfs_maximum"
type = "byte_size"
storage = "node"
default = "128MB"
environment = "THE8020_SANDBOX_RESOURCES_SERVICE_TMPFS_MAXIMUM"
runtime_mutable = true
restart_required = false
description = "Bounded temporary-filesystem maximum for new service sandboxes; existing sandboxes keep their immutable resources."
