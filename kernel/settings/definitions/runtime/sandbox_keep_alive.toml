key = "runtime.sandbox.keep_alive"
type = "integer"
storage = "node"
default = 120000
environment = "THE8020_RUNTIME_SANDBOX_KEEP_ALIVE"
minimum = 0
maximum = 86400000
runtime_mutable = false
restart_required = true
description = "Retain unused service and job/module sandboxes for this many milliseconds after their last Worker leaves. Zero disables retention; reserved warm capacity is retained independently."
