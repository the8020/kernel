key = "network.root_alias"
type = "string"
storage = "global"
default = "the8020/uui/shell/"
environment = "THE8020_NETWORK_ROOT_ALIAS"
pattern = "^[A-Za-z0-9_-]+(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*/?$"
runtime_mutable = false
restart_required = true
description = "Relative 80|20 application path receiving requests made to the HTTP server root."
