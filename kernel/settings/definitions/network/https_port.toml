key = "network.https_port"
type = "integer"
storage = "node"
default = 8443
environment = "THE8020_NETWORK_HTTPS_PORT"
minimum = 0
maximum = 65535
runtime_mutable = true
restart_required = false
description = "Native HTTPS listener port; zero disables this node's TLS listener. HTTPS policy is managed by the HTTPS package."
