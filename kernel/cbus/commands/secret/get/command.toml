version = 1
id = "secret.get"
path = ["secret", "get"]
summary = "Get a secret"
description = "Returns one named secret value to the authenticated administrative caller."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/secret/get/get.go"
symbol = "New"
[[parameters]]
name = "name"
type = "string"
position = 0
required = true
description = "Secret name."
[[result]]
name = "secret"
type = "object"
[[examples]]
command = "secret get github"
