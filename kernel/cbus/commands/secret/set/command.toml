version = 1
id = "secret.set"
path = ["secret", "set"]
summary = "Set a secret"
description = "Creates or overwrites one named secret. The value is securely prompted; use --value-stdin only for noninteractive automation."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/secret/set/set.go"
symbol = "New"
[[parameters]]
name = "name"
type = "string"
position = 0
required = true
description = "Secret name."
[[parameters]]
name = "value"
type = "string"
required = true
secret = true
secret_prompt = "Secret value: "
secret_confirmation_prompt = "Confirm secret value: "
secret_stdin_option = "value-stdin"
description = "Read one secret-value line from standard input instead of prompting and confirming."
[[result]]
name = "secret"
type = "object"
[[examples]]
command = "secret set github"
[[examples]]
command = "printf '%s\\n' \"$SECRET_VALUE\" | admin secret set github --value-stdin"
