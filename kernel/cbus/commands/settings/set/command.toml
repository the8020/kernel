version = 1
id = "kernel.config.set"
path = ["kernel.config.set"]
summary = "Set a kernel setting"
description = "Persists a node-local kernel setting and applies runtime-mutable changes transactionally."
mutates_state = true
restart_behavior = "depends_on_setting"
[handler]
file = "kernel/cbus/commands/settings/set/set.go"
symbol = "New"
[[parameters]]
name = "key"
type = "string"
position = 0
required = true
description = "Dot-separated setting key."
[[parameters]]
name = "value"
type = "string"
position = 1
required = true
description = "Value converted according to the setting definition."
[[result]]
name = "setting"
type = "object"
[[examples]]
command = "kernel.config.set network.main_port 9090"
