version = 1
id = "kernel.config.list"
path = ["kernel.config.list"]
summary = "List kernel settings"
description = "Lists node-local kernel settings. Use the detail view for complete values and restart state."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/settings/list/list.go"
symbol = "New"
[[parameters]]
name = "view"
type = "string"
position = 0
required = false
description = "Optional view; use detail for complete setting records."
[[result]]
name = "settings"
type = "array"
[[examples]]
command = "kernel.config.list"
[[examples]]
command = "kernel.config.list detail"
