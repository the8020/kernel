version = 1
id = "kernel.config.get"
path = ["kernel.config.get"]
summary = "Get one kernel setting"
description = "Returns one node-local kernel setting."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/settings/get/get.go"
symbol = "New"
[[parameters]]
name = "key"
type = "string"
position = 0
required = true
description = "Dot-separated setting key."
[[result]]
name = "setting"
type = "object"
[[examples]]
command = "kernel.config.get network.main_port"
