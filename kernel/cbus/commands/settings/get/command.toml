version = 1
id = "settings.get"
path = ["settings", "get"]
aliases = [["config", "get"]]
summary = "Get one 80|20 setting"
description = "Returns the declared node or global storage, source, configured value, and active value for one setting."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/settings/get/get.go"
symbol = "New"
[[parameters]]
name = "key"
type = "string"
position = 0
required = true
description = "Dot-separated setting key."
[[result]]
name = "setting"
type = "object"
[[examples]]
command = "settings get network.main_port"
