version = 1
id = "kernel.config.unset"
path = ["kernel.config.unset"]
summary = "Unset a kernel setting"
description = "Removes a node-local kernel setting override and reveals the next lower-precedence value."
mutates_state = true
restart_behavior = "depends_on_setting"
[handler]
file = "kernel/cbus/commands/settings/unset/unset.go"
symbol = "New"
[[parameters]]
name = "key"
type = "string"
position = 0
required = true
description = "Dot-separated setting key."
[[result]]
name = "setting"
type = "object"
[[examples]]
command = "kernel.config.unset network.main_port"
