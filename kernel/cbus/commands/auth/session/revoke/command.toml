version = 1
id = "auth.session.revoke"
path = ["auth", "session", "revoke"]
summary = "Revoke an authentication session"
description = "Idempotently deletes one bootstrap authentication-session file by its public session ID."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/auth/session/revoke/revoke.go"
symbol = "New"
[[parameters]]
name = "session_id"
type = "string"
position = 0
required = true
description = "Public authentication-session ID, not the cookie value."
[[result]]
name = "revoked"
type = "boolean"
[[examples]]
command = "auth session revoke 0123456789abcdef0123456789abcdef"
