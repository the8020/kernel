version = 1
id = "auth.session.cleanup"
path = ["auth", "session", "cleanup"]
summary = "Clean up expired authentication sessions"
description = "Runs the same idempotent expired authentication-session cleanup performed periodically by every kernel node."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/auth/session/cleanup/cleanup.go"
symbol = "New"
[[result]]
name = "removed_count"
type = "integer"
[[examples]]
command = "auth session cleanup"
