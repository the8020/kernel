version = 1
id = "auth.bootstrap_admin.disable"
path = ["auth", "bootstrap-admin", "disable"]
summary = "Disable a bootstrap administrator"
description = "Disables a bootstrap administrator, increments the authentication version, and deletes current authentication sessions."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/auth/bootstrapadmin/disable/disable.go"
symbol = "New"
[[parameters]]
name = "username"
type = "string"
position = 0
required = true
description = "Bootstrap administrator username: 3-32 lowercase letters or digits."
[[result]]
name = "user"
type = "object"
[[examples]]
command = "auth bootstrap-admin disable admin"
