version = 1
id = "auth.bootstrap_admin.set_password"
path = ["auth", "bootstrap-admin", "set-password"]
summary = "Set a bootstrap administrator password"
description = "Replaces a bootstrap administrator password, increments the authentication version, and deletes current authentication sessions. Use --password-stdin only for noninteractive automation."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/auth/bootstrapadmin/setpassword/setpassword.go"
symbol = "New"
[[parameters]]
name = "username"
type = "string"
position = 0
required = true
description = "Bootstrap administrator username: 3-32 lowercase letters or digits."
[[parameters]]
name = "password"
type = "string"
required = true
secret = true
secret_prompt = "Password: "
secret_confirmation_prompt = "Confirm password: "
secret_stdin_option = "password-stdin"
description = "Read one password line from standard input instead of prompting and confirming."
[[result]]
name = "user"
type = "object"
[[examples]]
command = "auth bootstrap-admin set-password admin"
