version = 1
id = "auth.bootstrap_admin.enable"
path = ["auth", "bootstrap-admin", "enable"]
summary = "Enable a bootstrap administrator"
description = "Enables an existing bootstrap administrator."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/auth/bootstrapadmin/enable/enable.go"
symbol = "New"
[[parameters]]
name = "username"
type = "string"
position = 0
required = true
description = "Bootstrap administrator username: 3-32 lowercase letters or digits."
[[result]]
name = "user"
type = "object"
[[examples]]
command = "auth bootstrap-admin enable admin"
