version = 1
id = "auth.bootstrap_admin.add"
path = ["auth", "bootstrap-admin", "add"]
summary = "Add a bootstrap administrator"
description = "Creates an enabled bootstrap administrator using a securely prompted password. Use --password-stdin only for noninteractive automation."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/auth/bootstrapadmin/add/add.go"
symbol = "New"
[[parameters]]
name = "username"
type = "string"
position = 0
required = true
prompt = "Username: "
description = "Bootstrap administrator username: 3-32 lowercase letters or digits."
[[parameters]]
name = "password"
type = "string"
required = true
secret = true
secret_prompt = "Password: "
secret_confirmation_prompt = "Confirm password: "
secret_stdin_option = "password-stdin"
description = "Read one password line from standard input instead of prompting and confirming."
[[result]]
name = "user"
type = "object"
[[examples]]
command = "auth bootstrap-admin add admin"
[[examples]]
command = "printf '%s\\n' \"$ADMIN_PASSWORD\" | admin auth bootstrap-admin add admin --password-stdin"
