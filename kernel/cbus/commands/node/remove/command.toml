version = 1
id = "node.remove"
path = ["node", "remove"]
summary = "Remove an application-server node"
description = "Removes a non-local node from shared config/nodes.toml."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/node/remove/remove.go"
symbol = "New"
[[parameters]]
name = "node_id"
type = "string"
position = 0
required = true
description = "Node ID to remove."
[[result]]
name = "removed"
type = "boolean"
[[result]]
name = "node_id"
type = "string"
[[examples]]
command = "node remove retired-node"
