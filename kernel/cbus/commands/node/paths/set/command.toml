version = 1
id = "node.paths.set"
path = ["node", "paths", "set"]
summary = "Set initialized storage paths"
description = "Validates and atomically replaces the packages, system configuration, shared state, and user-data roots. The running kernel continues using its active paths until restart."
mutates_state = true
restart_behavior = "kernel_restart_required"
[handler]
file = "kernel/cbus/commands/node/paths/set/set.go"
symbol = "New"
[[parameters]]
name = "packages"
type = "string"
option = "packages"
required = true
description = "Absolute packages root synchronized outside 80|20."
[[parameters]]
name = "config"
type = "string"
option = "config"
required = true
description = "Absolute system configuration root synchronized outside 80|20."
[[parameters]]
name = "users"
type = "string"
option = "users"
required = true
description = "Absolute per-user data root synchronized outside 80|20."
[[parameters]]
name = "state"
type = "string"
option = "state"
required = true
description = "Absolute shared system state root synchronized outside 80|20."
[[result]]
name = "layout"
type = "object"
[[examples]]
command = "node paths set --packages /srv/8020/packages --config /srv/8020/config --users /srv/8020/users --state /srv/8020/state"
