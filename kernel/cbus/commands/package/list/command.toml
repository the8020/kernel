version = 1
id = "package.list"
path = ["package", "list"]
summary = "List filesystem packages"
description = "Scans packages/*/*/package.toml on every invocation and lists path-derived identity, description, validity, service count, and any validation failure. Use package inspect for paths and complete metadata."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/list/list.go"
symbol = "New"
[[result]]
name = "packages"
type = "array"
[[examples]]
command = "package list"
