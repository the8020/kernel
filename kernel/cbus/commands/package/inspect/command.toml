version = 1
id = "package.inspect"
path = ["package", "inspect"]
summary = "Inspect one filesystem package"
description = "Reads one exact path-derived package manifest and performs bounded detail-only inspection of its portable services, programs, and non-Git files."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/inspect/inspect.go"
symbol = "New"
[[parameters]]
name = "package_id"
type = "string"
position = 0
required = true
description = "Filesystem-derived namespace/repository package ID."
[[result]]
name = "package"
type = "object"
[[examples]]
command = "package inspect the8020/demo"
