version = 1
id = "kernel.packages.synchronize"
path = ["kernel.packages.synchronize"]
summary = "Synchronize desired packages"
description = "Synchronize selected indexed repositories to their desired commit, tag, or default branch. Displaced local work is saved under the instance checkout-recovery directory; recovery_copy identifies the complete checkout. Copy it to a new private directory to inspect or recover work. Omit --packages to select the complete index."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/synchronize/synchronize.go"
symbol = "New"
[[parameters]]
name = "packages"
type = "string"
option = "packages"
required = false
description = "Comma-separated package IDs; omit for all indexed packages."
[[parameters]]
name = "git_token"
type = "string"
required = false
description = "Transient Git token or Basic password read securely from standard input."
secret = true
secret_prompt = "Git token or password: "
secret_stdin_option = "git-token-stdin"
[[parameters]]
name = "git_username"
type = "string"
option = "git-username"
required = false
description = "HTTP Basic username; defaults to x-access-token when omitted."
[[result]]
name = "packages"
type = "array"
[[parameters]]
name = "force_columns"
type = "string"
option = "force"
required = false
description = "Exact comma-separated table.column scopes. Requires one explicit package. Cleanup/native DDL run first; force may repair only invalid cells using legal NULL or an authored target default. No table reset."
[[parameters]]
name = "schema_preview"
type = "boolean"
option = "schema"
required = false
description = "Preview the selected candidate schema without callbacks or publication. Requires one explicit package."
[[parameters]]
name = "approved_plan"
type = "string"
option = "approved-plan"
required = false
description = "Bind repair confirmation to the exact candidate schema plan."
[[examples]]
command = "kernel.packages.synchronize --packages the8020/uui,the8020/admin-core"
[[examples]]
command = "kernel.packages.synchronize --packages acme/private --git-token-stdin"
