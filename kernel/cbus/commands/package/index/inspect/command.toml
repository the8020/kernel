version = 1
id = "kernel.packages.inspect"
path = ["kernel.packages.inspect"]
summary = "Inspect desired package"
description = "Reads one exact desired and active package record."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/index/inspect/inspect.go"
symbol = "New"
[[parameters]]
name = "package_id"
type = "string"
position = 0
required = true
description = "Author/repository package ID."
[[result]]
name = "package"
type = "object"
[[examples]]
command = "kernel.packages.inspect the8020/uui"
