version = 1
id = "package.index.set"
path = ["package", "index", "set"]
summary = "Set desired package source and version"
description = "Atomically creates or replaces one package-index document. Commit and tag are mutually exclusive; omitting both selects the latest default-branch commit."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/index/set/set.go"
symbol = "New"
[[parameters]]
name = "author"
type = "string"
position = 0
required = true
description = "Package author or namespace."
[[parameters]]
name = "repository"
type = "string"
position = 1
required = true
description = "Package repository name."
[[parameters]]
name = "source"
type = "string"
option = "source"
required = false
description = "Public HTTPS Git URL."
[[parameters]]
name = "commit"
type = "string"
option = "commit"
required = false
description = "Exact Git commit object ID."
[[parameters]]
name = "tag"
type = "string"
option = "tag"
required = false
description = "Exact Git tag."
[[parameters]]
name = "local"
type = "boolean"
option = "local"
required = false
description = "Declare an unlinked local package."
[[result]]
name = "package"
type = "object"
[[examples]]
command = "package index set the8020/uui --source https://github.com/the8020/uui.git"
