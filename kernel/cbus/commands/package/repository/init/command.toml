version = 1
id = "package.repository.init"
path = ["package", "repository", "init"]
summary = "Initialize a package repository"
description = "Explicitly initializes one package as an independent Git repository and creates its initial commit."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/repository/init/init.go"
symbol = "New"
[[parameters]]
name = "package_id"
type = "string"
position = 0
required = true
description = "Namespace/repository package ID."
[[parameters]]
name = "author_name"
type = "string"
option = "author-name"
required = false
description = "Initial commit author name."
[[parameters]]
name = "author_email"
type = "string"
option = "author-email"
required = false
description = "Initial commit author email."
[[parameters]]
name = "message"
type = "string"
option = "message"
required = false
description = "Initial commit message."
[[result]]
name = "repository"
type = "object"
[[examples]]
command = "package repository init the8020/dev-core --author-name Developer --author-email developer@example.test"
