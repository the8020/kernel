version = 1
id = "package.repository.status"
path = ["package", "repository", "status"]
summary = "Report package repository status"
description = "Reports active branch, HEAD, cleanliness, remote, and activation readiness for one package."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/repository/status/status.go"
symbol = "New"
[[parameters]]
name = "package_id"
type = "string"
position = 0
required = true
description = "Namespace/repository package ID."
[[result]]
name = "repository"
type = "object"
[[examples]]
command = "package repository status the8020/dev-core"
