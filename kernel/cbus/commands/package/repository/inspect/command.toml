version = 1
id = "package.repository.inspect"
path = ["package", "repository", "inspect"]
summary = "Inspect a package repository"
description = "Inspects one independent package Git repository and its activation readiness."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/repository/inspect/inspect.go"
symbol = "New"
[[parameters]]
name = "package_id"
type = "string"
position = 0
required = true
description = "Namespace/repository package ID."
[[result]]
name = "repository"
type = "object"
[[examples]]
command = "package repository inspect the8020/dev-core"
