version = 1
id = "package.repository.push"
path = ["package", "repository", "push"]
summary = "Push a package repository"
description = "Pushes the current package branch to its remote, applying the selected stored secret when configured."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/package/repository/push/push.go"
symbol = "New"
[[parameters]]
name = "package_id"
type = "string"
position = 0
required = true
description = "Namespace/repository package ID."
[[result]]
name = "repository"
type = "object"
[[examples]]
command = "package repository push the8020/uui"
