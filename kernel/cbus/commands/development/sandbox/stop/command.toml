version = 1
id = "development.sandbox.stop"
path = ["development", "sandbox", "stop"]
summary = "Stop a developer sandbox"
description = "Checkpoints private package deltas, stops the process, and retains the user's dev-sandbox state."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/stop/stop.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[result]]
name = "sandbox"
type = "object"
[[examples]]
command = "development sandbox stop alice"
