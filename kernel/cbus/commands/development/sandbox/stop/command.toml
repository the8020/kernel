version = 1
id = "development.sandbox.stop"
path = ["development", "sandbox", "stop"]
summary = "Stop a developer sandbox"
description = "Stops and deletes only the running sandbox process while retaining its native durable filesystems."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/stop/stop.go"
symbol = "New"
[[parameters]]
name = "workspace_id"
type = "string"
position = 0
required = true
description = "Development workspace ID."
[[result]]
name = "workspace"
type = "object"
[[examples]]
command = "development sandbox stop default-0123456789abcdef"
