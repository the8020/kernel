version = 1
id = "development.sandbox.create"
path = ["development", "sandbox", "create"]
summary = "Create a developer sandbox"
description = "Creates and starts the one default persistent development workspace for a developer user."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/create/create.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[result]]
name = "workspace"
type = "object"
[[examples]]
command = "development sandbox create developer-a"
