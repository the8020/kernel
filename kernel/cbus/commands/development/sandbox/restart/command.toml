version = 1
id = "development.sandbox.restart"
path = ["development", "sandbox", "restart"]
summary = "Restart a developer sandbox"
description = "Checkpoints private package deltas and recreates the process on the shared lower tree and same image-qualified system filesystem."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/restart/restart.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[result]]
name = "sandbox"
type = "object"
[[examples]]
command = "development sandbox restart alice"
