version = 1
id = "development.sandbox.kill"
path = ["development", "sandbox", "kill"]
summary = "Kill a developer sandbox"
description = "Checkpoints private package deltas, force-kills and deletes the active process, and retains the sandbox's durable files."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/kill/kill.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[result]]
name = "sandbox"
type = "object"
[[examples]]
command = "development sandbox kill alice"
