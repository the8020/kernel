version = 1
id = "development.sandbox.inspect"
path = ["development", "sandbox", "inspect"]
summary = "Inspect a developer sandbox"
description = "Inspects one user's development sandbox and activation state."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/inspect/inspect.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[result]]
name = "sandbox"
type = "object"
[[examples]]
command = "development sandbox inspect alice"
