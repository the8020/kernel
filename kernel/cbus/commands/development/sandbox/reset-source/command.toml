version = 1
id = "development.sandbox.reset_source"
path = ["development", "sandbox", "reset-source"]
summary = "Discard private package changes"
description = "Discards private package-overlay checkpoints and restarts on current shared packages while preserving system customization, including root's home."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/reset-source/reset_source.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[parameters]]
name = "confirm"
type = "boolean"
option = "confirm"
required = true
description = "Confirm irreversible loss of unpublished private package changes."
[[result]]
name = "sandbox"
type = "object"
[[examples]]
command = "development sandbox reset-source alice --confirm"
