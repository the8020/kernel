version = 1
id = "development.sandbox.factory_reset"
path = ["development", "sandbox", "factory-reset"]
summary = "Factory reset a development sandbox"
description = "Destroys private package checkpoints and all system customization, including root's home, then recreates the sandbox from current defaults."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/factory-reset/factory_reset.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[parameters]]
name = "confirm"
type = "boolean"
option = "confirm"
required = true
description = "Confirm irreversible loss of private package changes and system customization."
[[result]]
name = "sandbox"
type = "object"
[[examples]]
command = "development sandbox factory-reset alice --confirm"
