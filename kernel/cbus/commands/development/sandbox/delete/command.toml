version = 1
id = "development.sandbox.delete"
path = ["development", "sandbox", "delete"]
summary = "Delete a development sandbox"
description = "Deletes the user's development sandbox and everything persisted beneath users/<user>/dev-sandbox."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/sandbox/delete/delete.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[result]]
name = "deleted"
type = "boolean"
[[examples]]
command = "development sandbox delete alice"
