version = 1
id = "development.activate.preview"
path = ["development", "activate", "preview"]
summary = "Preview package activation"
description = "Scans the live private package overlay once and reports changed files, row statistics, shared Git state, readiness, and selection without modifying shared repositories."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/development/activate/preview/preview.go"
symbol = "New"
[[parameters]]
name = "user_id"
type = "string"
position = 0
required = true
description = "Developer user ID."
[[parameters]]
name = "message"
type = "string"
option = "message"
required = false
description = "Default commit message used to shape the preview."
[[parameters]]
name = "packages"
type = "string"
option = "packages"
required = false
description = "Comma-separated package IDs selected for activation."
[[parameters]]
name = "package_messages"
type = "string"
option = "package-messages"
required = false
description = "JSON object of per-package commit-message overrides."
[[parameters]]
name = "author_name"
type = "string"
option = "author-name"
required = false
description = "Git author name."
[[parameters]]
name = "author_email"
type = "string"
option = "author-email"
required = false
description = "Git author email."
[[parameters]]
name = "metadata"
type = "string"
option = "metadata"
required = false
description = "JSON object of activation metadata."
[[result]]
name = "preview"
type = "object"
[[examples]]
command = "development activate preview alice --packages the8020/dev-core"
