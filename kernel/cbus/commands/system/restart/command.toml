version = 1
id = "system.restart"
path = ["system", "restart"]
aliases = [["restart"]]
summary = "Restart the kernel"
description = "Requests orderly cleanup and then replaces the running kernel process with the current kernel executable, independent of the run.sh process that opened the administrative console."
mutates_state = true
restart_behavior = "restarts_kernel"
[handler]
file = "kernel/cbus/commands/system/restart/restart.go"
symbol = "New"
[[result]]
name = "requested"
type = "boolean"
[[examples]]
command = "restart"
