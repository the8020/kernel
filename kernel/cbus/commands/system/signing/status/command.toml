version = 1
id = "kernel.signing.status"
path = ["kernel.signing.status"]
summary = "Show the active signing key fingerprint"
description = "Returns only the public key fingerprint, independently of packages and database availability."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/system/signing/signing.go"
symbol = "Status"
[[result]]
name = "fingerprint"
type = "string"

[[examples]]
command = "kernel.signing.status"
