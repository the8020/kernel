version = 1
id = "kernel.signing.replace"
path = ["kernel.signing.replace"]
summary = "Replace the deployment master key"
description = "Atomically persists a master seed and replaces all derived signing keys. Previous signatures and tokens become invalid immediately; peer connections require the new key. A non-empty THE8020_SIGNING_KEY overrides this value at the next startup."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/system/signing/signing.go"
symbol = "Replace"
[[parameters]]
name = "key"
type = "string"
required = true
description = "Standard base64-encoded 32-byte random master seed."
secret = true
secret_prompt = "Signing key: "
secret_stdin_option = "key-stdin"
[[result]]
name = "fingerprint"
type = "string"

[[examples]]
command = "kernel.signing.replace --key-stdin"
