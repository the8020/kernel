version = 1
id = "kernel.status"
path = ["kernel.status"]
summary = "Show kernel status"
description = "Returns identity, process, listeners, logging, database readiness and pool pressure, runtime isolation mode, uptime, graceful shutdown/restart progress, and build information for the running kernel."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/system/status/status.go"
symbol = "New"
[[result]]
name = "instance_uuid"
type = "string"
[[result]]
name = "pid"
type = "integer"
[[result]]
name = "instance_root"
type = "string"
[[result]]
name = "uptime"
type = "string"
[[result]]
name = "admin_socket"
type = "string"
[[result]]
name = "main_port"
type = "integer"
[[result]]
name = "logging_enabled"
type = "boolean"
[[result]]
name = "active_log_file"
type = "string"
[[result]]
name = "build_id"
type = "string"
[[result]]
name = "runtime_ready"
type = "boolean"
[[result]]
name = "runtime_mode"
type = "string"
[[result]]
name = "runtime_failure"
type = "string"
[[result]]
name = "database_backend"
type = "string"
[[result]]
name = "database_location"
type = "string"
[[result]]
name = "database_status"
type = "string"
[[result]]
name = "database_catalog_version"
type = "integer"
[[result]]
name = "database_initialized"
type = "boolean"
[[result]]
name = "database_pending_deployment"
type = "boolean"
[[result]]
name = "database_pool_maximum_open_connections"
type = "integer"
[[result]]
name = "database_pool_maximum_idle_connections"
type = "integer"
[[result]]
name = "database_pool_open_connections"
type = "integer"
[[result]]
name = "database_pool_in_use_connections"
type = "integer"
[[result]]
name = "database_pool_idle_connections"
type = "integer"
[[result]]
name = "database_pool_wait_count"
type = "integer"
[[result]]
name = "database_pool_wait_duration_milliseconds"
type = "integer"
[[result]]
name = "database_error"
type = "string"
[[result]]
name = "database_catalog_error"
type = "string"
[[result]]
name = "database_last_deployment_at"
type = "string"
[[result]]
name = "database_last_deployment_error"
type = "string"
[[result]]
name = "shutdown_requested"
type = "boolean"
[[result]]
name = "restart_requested"
type = "boolean"
[[result]]
name = "shutdown_percent"
type = "integer"
[[result]]
name = "shutdown_completed_steps"
type = "integer"
[[result]]
name = "shutdown_total_steps"
type = "integer"
[[result]]
name = "shutdown_step"
type = "string"
[[result]]
name = "shutdown_message"
type = "string"
[[examples]]
command = "kernel.status"
