version = 1
id = "database.table.trim"
path = ["database", "table", "trim"]
aliases = [["db", "table", "trim"]]
summary = "Permanently trim retired database objects"
description = "Drops selected retired columns or one retired table. This permanently deletes stored data."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/database/table/trim/trim.go"
symbol = "New"
[[parameters]]
name = "table_id"
type = "string"
position = 0
required = true
description = "Canonical table identifier."
[[parameters]]
name = "columns"
type = "string"
option = "columns"
required = false
description = "Comma-separated retired column names."
[[parameters]]
name = "drop_table"
type = "boolean"
option = "drop-table"
required = false
description = "Permanently drop the retired table."
[[parameters]]
name = "confirm"
type = "boolean"
option = "confirm"
required = true
description = "Confirm permanent data deletion."
[[result]]
name = "table_id"
type = "string"
[[result]]
name = "dropped_table"
type = "boolean"
[[result]]
name = "dropped_columns"
type = "array"
[[examples]]
command = "database table trim the8020__db__example --columns oldField --confirm"
