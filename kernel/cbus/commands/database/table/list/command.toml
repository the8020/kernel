version = 1
id = "database.table.list"
path = ["database", "table", "list"]
aliases = [["db", "table", "list"]]
summary = "List cataloged database tables"
description = "Lists active and retired tables from the database-owned 80|20 catalog."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/database/table/list/list.go"
symbol = "New"
[[result]]
name = "tables"
type = "array"
[[examples]]
command = "database table list"
