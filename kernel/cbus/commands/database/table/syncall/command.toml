version = 1
id = "database.table.sync_all"
path = ["database", "table", "sync-all"]
aliases = [["db", "table", "sync-all"]]
summary = "Synchronize all activated tables"
description = "Evaluates all installed package table definitions in bounded batches and applies safe changes."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/database/table/syncall/syncall.go"
symbol = "New"
[[result]]
name = "tables"
type = "array"
[[examples]]
command = "database table sync-all"
