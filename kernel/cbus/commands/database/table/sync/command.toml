version = 1
id = "database.table.sync"
path = ["database", "table", "sync"]
aliases = [["db", "table", "sync"]]
summary = "Synchronize one table"
description = "Evaluates one activated TypeScript definition and applies safe schema changes."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/database/table/sync/sync.go"
symbol = "New"
[[parameters]]
name = "table_id"
type = "string"
position = 0
required = true
description = "Canonical table identifier."
[[parameters]]
name = "source_package"
type = "string"
option = "package"
required = false
description = "Source package ID; required when the table is not yet catalogued."
[[result]]
name = "table"
type = "object"
[[examples]]
command = "database table sync the8020__db__example --package the8020/db"
