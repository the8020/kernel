version = 1
id = "database.check"
path = ["database", "check"]
aliases = [["db", "check"]]
summary = "Check the system database connection"
description = "Verifies that the configured SQLite or PostgreSQL system database is reachable and reports catalog readiness. Failure does not stop the kernel control plane."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/database/check/check.go"
symbol = "New"
[[result]]
name = "backend"
type = "string"
[[result]]
name = "location"
type = "string"
[[result]]
name = "status"
type = "string"
[[result]]
name = "catalog_version"
type = "integer"
[[result]]
name = "initialized"
type = "boolean"
[[result]]
name = "pending_deployment"
type = "boolean"
[[result]]
name = "catalog_error"
type = "string"
[[result]]
name = "last_deployment_at"
type = "string"
[[result]]
name = "last_deployment_error"
type = "string"
[[examples]]
command = "database check"
