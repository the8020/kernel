version = 1
id = "service.validate"
path = ["service", "validate"]
summary = "Validate a filesystem service"
description = "Checks manifests and entrypoint safety, then loads, type-checks, resolves imports, initializes routes, and generates OpenAPI inside the normal gVisor/Deno environment without changing shared desired state."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/service/validate/validate.go"
symbol = "New"
[[parameters]]
name = "service_id"
type = "string"
position = 0
required = true
description = "Filesystem-derived service ID."
[[result]]
name = "validation"
type = "object"
[[examples]]
command = "service validate the8020/demo/variables"
