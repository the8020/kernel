version = 1
id = "service.list"
path = ["service", "list"]
summary = "List filesystem services"
description = "Scans packages from disk and lists canonical identity, description, state, enabled status, live version count, local capacity, and any validation failure. Use service inspect for versioned sandboxes, configuration, and metrics."
mutates_state = false
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/service/list/list.go"
symbol = "New"
[[result]]
name = "services"
type = "array"
[[examples]]
command = "service list"
