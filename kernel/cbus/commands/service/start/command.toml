version = 1
id = "service.start"
path = ["service", "start"]
summary = "Start a filesystem service"
description = "Enables the service in shared desired state, increments its generation, and waits for local ready capacity."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/service/start/start.go"
symbol = "New"
[[parameters]]
name = "service_id"
type = "string"
position = 0
required = true
description = "Service ID."
[[parameters]]
name = "detail"
type = "boolean"
option = "detail"
required = false
description = "Show complete effective configuration, instance identities, failures, and metrics."
[[result]]
name = "state"
type = "string"
[[examples]]
command = "service start the8020/demo/variables"
