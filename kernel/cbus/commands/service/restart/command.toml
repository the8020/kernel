version = 1
id = "service.restart"
path = ["service", "restart"]
summary = "Restart a filesystem service"
description = "Increments the desired version, validates and starts replacement capacity, switches traffic when ready, and then drains the old version."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/service/restart/restart.go"
symbol = "New"
[[parameters]]
name = "service_id"
type = "string"
position = 0
required = true
description = "Filesystem-derived service ID."
[[parameters]]
name = "detail"
type = "boolean"
option = "detail"
required = false
description = "Show complete effective configuration, sandbox identities, failures, and metrics."
[[result]]
name = "state"
type = "string"
[[examples]]
command = "service restart the8020/demo/variables"
