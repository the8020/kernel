version = 1
id = "service.scale"
path = ["service", "scale"]
summary = "Scale a filesystem service"
description = "Updates canonical Worker scaling, sandbox placement, and service lifecycle policy, then reconciles the new generation."
mutates_state = true
restart_behavior = "none"
[handler]
file = "kernel/cbus/commands/service/scale/scale.go"
symbol = "New"
[[parameters]]
name = "service_id"
type = "string"
position = 0
required = true
description = "Service ID."
[[parameters]]
name = "minimum_workers"
type = "integer"
option = "minimum-workers"
required = false
description = "Minimum ready Workers; zero allows scale to zero."
[[parameters]]
name = "maximum_workers"
type = "integer"
option = "maximum-workers"
required = false
description = "Maximum ready Workers; zero is unlimited subject to kernel capacity."
[[parameters]]
name = "concurrency_per_worker"
type = "integer"
option = "concurrency-per-worker"
required = false
description = "Hard concurrent execution-slot limit per Worker."
[[parameters]]
name = "target_utilization"
type = "string"
option = "target-utilization"
required = false
description = "Scale-out target as a decimal greater than zero and at most one."
[[parameters]]
name = "worker_keep_alive"
type = "string"
option = "worker-keep-alive"
required = false
description = "How long an excess idle Worker remains alive, as a Go duration."
[[parameters]]
name = "workers_per_sandbox"
type = "integer"
option = "workers-per-sandbox"
required = false
description = "Per-service Worker packing limit in one compatible sandbox."
[[parameters]]
name = "sandbox_group"
type = "string"
option = "sandbox-group"
required = false
description = "Compatible sandbox-sharing group; empty uses the default shared group."
[[parameters]]
name = "minimum_sandboxes"
type = "integer"
option = "minimum-sandboxes"
required = false
description = "Minimum compatible warm sandboxes, independently of minimum Workers."
[[parameters]]
name = "service_type"
type = "string"
option = "service-type"
required = false
description = "Service lifecycle type: stateless or session."
[[parameters]]
name = "session_keep_alive"
type = "string"
option = "session-keep-alive"
required = false
description = "How long a session service retains its environment after activity ends, as a Go duration."
[[parameters]]
name = "detail"
type = "boolean"
option = "detail"
required = false
description = "Show complete effective configuration, sandbox identities, failures, and metrics."
[[result]]
name = "state"
type = "string"
[[examples]]
command = "service scale the8020/demo/variables --minimum-workers 2 --workers-per-sandbox 4"
