schema = 1

[[mounts]]
id = "packages"
target = "/workspace/packages"
behavior = "sandbox-source"
writable = true

[[mounts]]
id = "scripts"
source = "scripts"
target = "/workspace/scripts"
behavior = "read-only-shared"
writable = false
executable = true

[[mounts]]
id = "temporary"
target = "/tmp"
behavior = "ephemeral"
writable = true
